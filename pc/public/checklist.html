let currentLang=localStorage.getItem('moe-checklist-lang')||'zh';
let checkedSet=new Set();
const STORAGE_KEY='moe-serps-checklist-v3';

function loadState(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)checkedSet=new Set(JSON.parse(s))}catch(e){}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify([...checkedSet]))}

function switchLang(lang){
  if(currentLang===lang)return;
  currentLang=lang;
  localStorage.setItem('moe-checklist-lang',lang);
  document.getElementById('btnZh').classList.toggle('active',lang==='zh');
  document.getElementById('btnEn').classList.toggle('active',lang==='en');
  const t=I18N[lang];
  document.getElementById('badgeText').textContent=t.badge;
  document.getElementById('pageTitle').textContent=t.title;
  document.getElementById('pageSub').textContent=t.sub;
  document.getElementById('metaTest').innerHTML=`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>${t.metaTest}`;
  document.getElementById('metaDuration').innerHTML=`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${t.metaDuration}`;
  document.getElementById('lblProgress').textContent=t.progress;
  document.getElementById('roleTitle').textContent=t.roleTitle;
  ['thRole','thUser','thPass','thPage','btnExport','btnReset','btnPrint','bannerTitle','bannerSub'].forEach(id=>document.getElementById(id).textContent=t[id]);
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.title=t.title;
  renderRoleTable();render();
}

function buildUrl(path,env,isMobile){
  if(isMobile)return env==='online'?`${BASE_MOBILE}/login`:LOCAL_H5;
  const prefix=currentLang==='en'?'/en':'';
  const base=env==='local'?BASE_LOCAL:BASE_ONLINE;
  return `${base}${prefix}${path}`;
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function copyToClipboard(text,btnEl){
  navigator.clipboard.writeText(text).then(()=>{
    if(btnEl){btnEl.classList.add('copied');btnEl.innerHTML='<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    setTimeout(()=>{btnEl.classList.remove('copied');btnEl.innerHTML='<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>'},1200)}
    showToast(`${I18N[currentLang].copied}${text}`);
  });
}
function openUrl(url){window.open(url,'_blank')}

function renderRoleTable(){
  const tbody=document.getElementById('roleTableBody'), t=I18N[currentLang];
  tbody.innerHTML=t.roles.map(r=>`<tr><td><span class="class ${r.t}">${r.l}</span></td><td><span class="code">${r.u}</span></td><td><span class="code" style="cursor:pointer;padding:2px 6px;border-radius:4px;border:1px dashed #ccc;" onclick="event.stopPropagation();copyToClipboard('${r.p}',this)" title="${t.copied}">${r.p}</span></td><td><span style="font-size:10.5px;color:var(--fg-muted);font-family:'JetBrains Mono',monospace;">${r.pg}</span></td></tr>`).join('');
}

function render(){
  const container=document.getElementById('actsContainer'), t=I18N[currentLang];
  let html='';
  t.acts.forEach(act=>{
    const pref=`act${act.id}`, total=act.items.length;
    const done=act.items.filter((_,i)=>checkedSet.has(`${pref}-${i}`)).length;
    const isComplete=done===total&&total>0;
    let qlHtml='';
    if(act.lc){
      qlHtml=`<div class="ql-btn-group"><button class="ql-btn" onclick="event.stopPropagation();openUrl('${buildUrl('/login','local',false)}')" title="${t.loginBtn}: ${act.lc.u}"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>${t.openLocal}</button><button class="ql-btn ql-online" onclick="event.stopPropagation();openUrl('${buildUrl('/login','online',false)}')">${t.openOnline}</button></div>`;
    }
    html+=`<div class="act-card ${isComplete?'checked':''}" id="card-${act.id}">
      <div class="act-header" onclick="toggleCard(${act.id})">
        <div class="act-left"><div class="act-num">${String(act.id).padStart(2,'0')}</div><div class="act-title-group"><div class="act-name">${act.t}</div><div class="act-meta">${act.m}${act.lc?` · <span class="code">${act.lc.u} / ${act.lc.p}</span>`:''}</div></div></div>
        <div class="act-right">${qlHtml}<span class="act-progress-mini" style="color:${isComplete?'var(--check-fg)':'var(--fg-muted)'}">${done}/${total}</span><svg class="act-chevron" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div></div>
      <div class="act-body"><ul class="check-list">`;
    act.items.forEach((item,ii)=>{
      const cid=`${pref}-${ii}`, isChecked=checkedSet.has(cid);
      let descHtml=item.d;
      if(item.p&&!descHtml.includes('check-url-link')){
        const urls=[];
        if(item.mob){urls.push({l:t.openLocalH5,u:LOCAL_H5});urls.push({l:t.openOnlineH5,u:`${BASE_MOBILE}/login`})}
        else{let rp=item.p;urls.push({l:t.openLocal,u:buildUrl(rp,'local',false)});urls.push({l:t.openOnline,u:buildUrl(rp,'online',false)})}
        descHtml+=`<div class="url-links-row">${urls.map(u=>`<a class="check-url-link" href="${u.u}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg class="url-icon" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>${u.l}</a>`).join('')}</div>`;
      }
      let mockHtml='';
      if(item.ms){
        const fields=t.regMock.slice(item.ms[0],item.ms[1]).map(m=>`<div class="mock-field"><span class="mock-field-label">${m.l}</span><span class="mock-field-val" onclick="event.stopPropagation();copyToClipboard('${m.v.replace(/'/g,"\\'")}',this)" title="${t.copied}${m.l}">${m.v}</span><button class="copy-btn" onclick="event.stopPropagation();copyToClipboard('${m.v.replace(/'/g,"\\'")}',this)" title="${t.copied}${m.l}"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></button></div>`).join('');
        const allVals=t.regMock.slice(item.ms[0],item.ms[1]).map(m=>`${m.l}: ${m.v}`).join('\n');
        mockHtml=`<div class="mock-panel"><div class="mock-panel-title"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>${t.mockTitle}</div><div class="mock-grid">${fields}</div><button class="copy-all-btn" onclick="event.stopPropagation();copyToClipboard(\`${allVals.replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`,this)"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>${t.copyAll}</button></div>`;
      }
      html+=`<li class="check-item ${isChecked?'checked':''}" data-id="${cid}" onclick="toggleItem('${cid}',${act.id})">
        <div class="cb-wrap"><div class="cb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></div></div>
        <div class="check-content"><div class="check-step">${item.s}</div><div class="check-desc">${descHtml}</div>${mockHtml}${item.e?`<div class="check-expected">${t.expectedPrefix}${item.e}</div>`:''}</div></li>`;
    });
    html+=`</ul></div></div>`;
  });
  container.innerHTML=html;updateProgress();
}

function toggleCard(id){document.getElementById(`card-${id}`).classList.toggle('open')}
function toggleItem(cid,actId){
  if(checkedSet.has(cid))checkedSet.delete(cid);else checkedSet.add(cid);
  saveState();
  const el=document.querySelector(`[data-id="${cid}"]`);
  if(el)el.classList.toggle('checked');
  const act=I18N[currentLang].acts.find(a=>a.id===actId);
  if(act){const pref=`act${actId}`,total=act.items.length,done=act.items.filter((_,i)=>checkedSet.has(`${pref}-${i}`)).length;
    const card=document.getElementById(`card-${actId}`),miniEl=card?.querySelector('.act-progress-mini');
    if(miniEl)miniEl.textContent=`${done}/${total}`;
    if(done===total&&total>0){card?.classList.add('checked');if(miniEl)miniEl.style.color='var(--check-fg)'}
    else{card?.classList.remove('checked');if(miniEl)miniEl.style.color='var(--fg-muted)'}}
  updateProgress();
}
function updateProgress(){
  let total=0,done=0;
  I18N[currentLang].acts.forEach(act=>{total+=act.items.length;act.items.forEach((_,i)=>{if(checkedSet.has(`act${act.id}-${i}`))done++})});
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('progressText').textContent=`${done} / ${total}`;
  document.getElementById('progressFill').style.width=`${pct}%`;
  const banner=document.getElementById('doneBanner');
  if(done===total&&total>0)banner.classList.add('show');else banner.classList.remove('show');
  document.title=`${I18N[currentLang].title} [${pct}%]`;
}
function resetAll(){if(!confirm(I18N[currentLang].confirmReset))return;checkedSet.clear();saveState();render();showToast(I18N[currentLang].resetDone)}
function exportState(){
  const t=I18N[currentLang];
  let report=`# MOE SERPS POC — ${currentLang==='zh'?'验收报告':'Acceptance Report'}\n`;
  report+=`**Date:** ${new Date().toISOString().slice(0,10)}\n**Progress:** ${document.getElementById('progressText').textContent}\n\n`;
  let gT=0,gD=0;
  t.acts.forEach(act=>{
    const pref=`act${act.id}`,total=act.items.length;
    const done=act.items.filter((_,i)=>checkedSet.has(`${pref}-${i}`)).length;
    gT+=total;gD+=done;
    report+=`${done===total?'✅':done>0?'🔶':'⬜'} **ACT ${String(act.id).padStart(2,'0')}: ${act.t}** — ${done}/${total}\n`;
    act.items.forEach((item,i)=>{report+=`  ${checkedSet.has(`${pref}-${i}`)?'☑':'☐'} ${item.s} ${item.d.replace(/<[^>]+>/g,'')}\n`});report+='\n';
  });
  report+=`---\n**Total: ${gD}/${gT} (${Math.round(gD/gT*100)}%)\n`;
  const blob=new Blob([report],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`moe-serps-checklist-${currentLang}-${new Date().toISOString().slice(0,10)}.md`;a.click();URL.revokeObjectURL(a.href);
  showToast(t.exportDone);
}

loadState();
renderRoleTable();
render();
setTimeout(()=>toggleCard(0),300);
</script>
</body>
</html>
