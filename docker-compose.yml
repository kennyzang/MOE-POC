services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:/app/data/db.sqlite
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production}
      PORT: "4000"
      NODE_ENV: production
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health 2>/dev/null || wget -qO- http://localhost:4000/ 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  pc:
    build: ./pc
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mobile:
    build: ./mobile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
    driver: local
